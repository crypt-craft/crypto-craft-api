# Staging Deployment Pipeline
name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '18'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cryptocraft/api

jobs:
  # Run tests before deployment
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    if: ${{ !inputs.force_deploy }}

  # Build and push Docker images
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || inputs.force_deploy)
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging

    - name: Build and push API image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NODE_ENV=staging

    - name: Build and push Nginx image
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        file: ./nginx/Dockerfile
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/cryptocraft/nginx:staging
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to staging environment
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup staging environment variables
      run: |
        cat > config/staging.env << EOF
        NODE_ENV=staging
        DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
        REDIS_URL=${{ secrets.STAGING_REDIS_URL }}
        SOLANA_RPC_URL=https://api.devnet.solana.com
        JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
        RATE_LIMIT_RPM=500
        LOG_LEVEL=info
        API_VERSION=${{ needs.build.outputs.image_tag }}
        POSTGRES_DB=${{ secrets.STAGING_POSTGRES_DB }}
        POSTGRES_USER=${{ secrets.STAGING_POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
        EOF

    - name: Deploy to staging server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: ${{ secrets.STAGING_PORT }}
        script: |
          # Navigate to project directory
          cd /var/www/cryptocraft-api
          
          # Pull latest code
          git fetch origin
          git checkout develop
          git pull origin develop
          
          # Copy environment config
          echo "${{ secrets.STAGING_ENV_FILE }}" > config/staging.env
          
          # Pull latest images
          docker-compose -f docker-compose.staging.yml pull
          
          # Stop old containers
          docker-compose -f docker-compose.staging.yml down
          
          # Start new containers
          docker-compose -f docker-compose.staging.yml up -d
          
          # Wait for services to be ready
          sleep 30
          
          # Run database migrations
          docker-compose -f docker-compose.staging.yml exec -T api npm run db:migrate
          
          # Health check
          timeout 60 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'
          
          # Clean up old images
          docker image prune -f

  # Run smoke tests on staging
  smoke-test:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run smoke tests
      run: npm run test:smoke
      env:
        STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}

    - name: Test critical endpoints
      run: |
        # Health check
        curl -f ${{ secrets.STAGING_API_URL }}/health
        
        # GraphQL introspection
        curl -X POST ${{ secrets.STAGING_API_URL }}/graphql \
          -H "Content-Type: application/json" \
          -d '{"query": "{ __schema { types { name } } }"}' \
          -f
        
        # API version endpoint
        curl -f ${{ secrets.STAGING_API_URL }}/api/version

  # Performance test on staging
  performance-test:
    name: Staging Performance Test
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Artillery
      run: npm install -g artillery

    - name: Run performance tests against staging
      run: |
        artillery run tests/performance/staging-load-test.yml \
          --environment staging \
          --output staging-performance.json
      env:
        STAGING_API_URL: ${{ secrets.STAGING_API_URL }}

    - name: Generate performance report
      run: |
        artillery report staging-performance.json --output staging-performance.html

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: staging-performance-results
        path: |
          staging-performance.json
          staging-performance.html

    - name: Comment performance results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('staging-performance.json', 'utf8'));
          
          const summary = results.aggregate;
          const comment = `
          ## 🚀 Staging Performance Test Results
          
          | Metric | Value |
          |--------|-------|
          | Scenarios launched | ${summary.scenariosCreated} |
          | Scenarios completed | ${summary.scenariosCompleted} |
          | Requests completed | ${summary.requestsCompleted} |
          | RPS | ${summary.rps.mean.toFixed(2)} |
          | Response time (median) | ${summary.latency.median}ms |
          | Response time (95th) | ${summary.latency.p95}ms |
          | Errors | ${summary.errors} |
          
          ${summary.errors > 0 ? '⚠️ Some errors detected during testing' : '✅ All requests completed successfully'}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Notify deployment status
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.deploy.result == 'success' && needs.smoke-test.result == 'success' }}
      run: |
        echo "✅ Staging deployment successful!"
        echo "URL: ${{ secrets.STAGING_API_URL }}"
        echo "Image: ${{ needs.build.outputs.image_tag }}"

    - name: Notify failure
      if: ${{ needs.deploy.result == 'failure' || needs.smoke-test.result == 'failure' }}
      run: |
        echo "❌ Staging deployment failed!"
        echo "Deploy status: ${{ needs.deploy.result }}"
        echo "Smoke test status: ${{ needs.smoke-test.result }}"
        exit 1

    # Optional: Send Slack notification
    - name: Send Slack notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}