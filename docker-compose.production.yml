# Production Environment Docker Compose
version: '3.8'

services:
  # API Service - Multiple replicas with load balancing
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
      args:
        - NODE_ENV=production
    image: cryptocraft/api:${API_VERSION:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PGSSLMODE=require
      - REDIS_URL=${REDIS_URL}
      - REDIS_TLS=true
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - JWT_SECRET=${JWT_SECRET}
      - RATE_LIMIT_RPM=1000
      - LOG_LEVEL=warn
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
    env_file:
      - config/production.env
    volumes:
      - api_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # PostgreSQL Database with backup
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    env_file:
      - config/production.env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/migrations:/migrations
      - postgres_backups:/backups
      - postgres_logs:/var/log/postgresql
    # Expose only to internal network; remove public port mapping
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Redis Cluster for high availability
  redis-master:
    image: redis:7-alpine
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 1gb 
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_master_data:/data
    # Internal only; no public ports
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-replica:
    image: redis:7-alpine
    command: >
      redis-server 
      --replicaof redis-master 6379
      --appendonly yes 
      --maxmemory 1gb 
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_replica_data:/data
    depends_on:
      - redis-master
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Nginx Load Balancer with SSL
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: cryptocraft/nginx:${NGINX_VERSION:-latest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      - api
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/health", "--insecure"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Queue Workers - Horizontal scaling
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
      args:
        - NODE_ENV=production
    image: cryptocraft/api:${API_VERSION:-latest}
    command: npm run worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PGSSLMODE=require
      - REDIS_URL=${REDIS_URL}
      - REDIS_TLS=true
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - LOG_LEVEL=warn
    env_file:
      - config/production.env
    volumes:
      - worker_logs:/app/logs
    depends_on:
      - postgres
      - redis-master
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Database backup service
  postgres-backup:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "
        echo '${BACKUP_SCHEDULE} /backup.sh' | crontab - &&
        crond -f
      "
    depends_on:
      - postgres
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # SSL Certificate renewal
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    command: >
      sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "
    depends_on:
      - nginx
    restart: unless-stopped
    deploy:
      replicas: 1

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./monitoring/grafana/production:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Log aggregation - ELK Stack (optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    profiles:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - api_logs:/logs/api:ro
      - worker_logs:/logs/worker:ro
      - nginx_logs:/logs/nginx:ro
    depends_on:
      - elasticsearch
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    profiles:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - cryptocraft-prod-network
    restart: unless-stopped
    profiles:
      - elk

volumes:
  postgres_prod_data:
    driver: local
  postgres_backups:
    driver: local
  postgres_logs:
    driver: local
  redis_master_data:
    driver: local
  redis_replica_data:
    driver: local
  api_logs:
    driver: local
  worker_logs:
    driver: local
  nginx_logs:
    driver: local
  prometheus_prod_data:
    driver: local
  grafana_prod_data:
    driver: local
  elasticsearch_data:
    driver: local
  certbot_data:
    driver: local
  letsencrypt_data:
    driver: local

networks:
  cryptocraft-prod-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 172.22.0.0/16

# Production deployment configs
configs:
  nginx_config:
    file: ./nginx/nginx.production.conf
  prometheus_config:
    file: ./monitoring/prometheus.production.yml

secrets:
  postgres_password:
    external: true
  jwt_secret:
    external: true
  redis_password:
    external: true